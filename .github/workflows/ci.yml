name: CI

on:
  push:
    branches: [master]
    # A release is a tag, and the version guard below is most of what makes one
    # trustworthy — so tags have to run CI too.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A new push to the same branch supersedes the run already in flight.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # CalVer is a convention until something rejects a version that is not
      # one. On a tag this also proves the tag and Cargo.toml agree, so a
      # release cannot report a version that is nowhere in the history.
      - run: ./scripts/check-version.sh

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # --all-targets covers tests too, and clippy runs the rustc lints as well,
      # so an ordinary compiler warning fails here rather than sliding through.
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The end-to-end suite starts a real proxy in front of a mock upstream on
      # loopback, so this is a genuine integration run, not just unit tests.
      - run: cargo test --all-features --locked
      - run: cargo build --release --locked

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # This is a credential broker; a dependency with a known advisory should
      # stop the build rather than wait for someone to notice.
      - run: cargo audit
