[package]
name = "mcp-iap"
version = "0.1.0"
edition = "2021"
description = "Identity-Aware Proxy for LLM agents: authenticated, ACL-gated, fully audited access to APIs and MCP servers without ever handing the agent the real credential."
license = "MIT"
repository = "https://github.com/vpetersson/mcp-iap"
readme = "README.md"
keywords = ["proxy", "mcp", "agent", "security", "audit"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "signal", "net"] }
axum = { version = "0.8", features = ["json"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "charset", "http2", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
parking_lot = "0.12"
zeroize = "1"
ratatui = "0.29"
crossterm = "0.29"
url = { version = "2", features = ["serde"] }
rand = "0.8"
indexmap = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
